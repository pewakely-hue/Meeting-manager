let calDate=new Date(),calView='month';
const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function calEvents(key){let ev=[];db.actions.filter(a=>!a.done&&((a.start&&key>=a.start&&key<=plusDays(a.start,Math.max(1,Number(a.duration)||1)-1))||a.due===key)).forEach(a=>ev.push({id:a.id,type:'action',title:a.title,css:a.due===key&&a.due<today()?'overdue':'',prefix:a.due===key?'◆':'●'}));db.meetings.filter(m=>m.date===key).forEach(m=>ev.push({id:m.id,type:'meeting',title:m.title,css:'meeting',prefix:'▣'}));db.personal.filter(p=>p.date===key).forEach(p=>ev.push({id:p.id,type:'personal',title:p.title,css:'personal',prefix:'◆'}));return ev}
function previewCalendar(type,id){let item=(type==='action'?db.actions:type==='meeting'?db.meetings:db.personal).find(x=>x.id===id);if(!item)return;let details=type==='action'?`<p><strong>Project:</strong> ${esc(projectName(item.project))}</p><p><strong>Owner:</strong> ${esc(item.owner||'Unassigned')}</p><p><strong>Priority:</strong> ${esc(item.priority||'Medium')}</p><p><strong>Start:</strong> ${esc(item.start||'—')}</p><p><strong>Deadline:</strong> ${esc(item.due||'—')}</p><p><strong>Duration:</strong> ${esc(item.duration||1)} day(s)</p>`:type==='meeting'?`<p><strong>Project:</strong> ${esc(projectName(item.project))}</p><p><strong>Date:</strong> ${esc(item.date)}</p><p><strong>Type:</strong> ${esc(item.type||'Meeting')}</p><p><strong>Notes:</strong> ${(item.notes||[]).length}</p>`:`<p><strong>Type:</strong> ${esc(item.type||'Personal')}</p><p><strong>Date:</strong> ${esc(item.date||'—')}</p><p><strong>Time:</strong> ${esc(item.time||'—')}</p><p><strong>Duration:</strong> ${esc(item.duration||'—')} minutes</p>`;modal('Calendar item preview',`<h3>${esc(item.title)}</h3>${details}<div class="actionsrow"><button class="btn" onclick="closeModal()">Close</button>${type==='action'?`<button class="btn primary" onclick="closeModal();editAction('${id}')">Edit action</button>`:type==='meeting'?`<button class="btn primary" onclick="closeModal();openMeeting('${id}')">Open meeting</button>`:''}</div>`)}
function calendar(){
let y=calDate.getFullYear(),mo=calDate.getMonth(),first=new Date(y,mo,1),offset=(first.getDay()+6)%7;
let weekStart=new Date(calDate.getFullYear(),calDate.getMonth(),calDate.getDate()-((calDate.getDay()+6)%7));
let start=calView==='month'?new Date(y,mo,1-offset):weekStart,count=calView==='month'?42:7;
let range=calView==='month'?calDate.toLocaleString('en-GB',{month:'long',year:'numeric'}):`${weekStart.toLocaleDateString('en-GB',{day:'numeric',month:'short'})} – ${new Date(weekStart.getFullYear(),weekStart.getMonth(),weekStart.getDate()+6).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}`;
let days=Array.from({length:7},(_,i)=>new Date(weekStart.getFullYear(),weekStart.getMonth(),weekStart.getDate()+i));
let weekHtml=days.map(d=>{let key=dateKey(d),ev=calEvents(key);return `<section class="weekday"><div class="weekdayhead"><strong>${d.toLocaleDateString('en-GB',{weekday:'long'})}</strong><span>${d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}</span></div><div class="weekdayevents">${ev.length?ev.map(e=>`<button type="button" class="weekevent ${e.css}" onclick="previewCalendar('${e.type}','${e.id}')"><span>${e.prefix}</span><span class="weekeventtitle">${esc(e.title)}</span><span class="weekeventtype">${e.type==='action'?'Action':e.type==='meeting'?'Meeting':'Personal'}</span></button>`).join(''):'<div class="weekempty">No scheduled items</div>'}</div></section>`}).join('');
let monthHtml=`<div class="calendar">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dayname">${d}</div>`).join('')}${Array.from({length:count},(_,i)=>{let d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),key=dateKey(d),ev=calEvents(key);return `<div class="day" style="${calView==='month'&&d.getMonth()!==mo?'opacity:.38':''}"><div class="daynum">${d.getDate()}</div>${ev.map(e=>`<button type="button" class="event ${e.css}" style="display:block;width:100%;border:0;text-align:left;cursor:pointer" onclick="previewCalendar('${e.type}','${e.id}')" title="Preview ${esc(e.title)}">${e.prefix} ${esc(e.title)}</button>`).join('')}</div>`}).join('')}</div>`;
$('#content').innerHTML=head('Calendar','Select an item to preview its details.')+`<section class="panel"><div class="calendarhead"><div class="actionsrow"><button class="btn small" id="prevMonth">‹</button><button class="btn small" id="todayMonth">Today</button><button class="btn small" id="nextMonth">›</button></div><strong>${range}</strong><div class="actionsrow"><button class="btn small ${calView==='week'?'primary':''}" onclick="calView='week';calendar()">7 days</button><button class="btn small ${calView==='month'?'primary':''}" onclick="calView='month';calendar()">Month</button></div></div>${calView==='week'?`<div class="weekagenda">${weekHtml}</div>`:monthHtml}<div class="pillrow" style="margin-top:12px"><span class="pill">● Project action</span><span class="pill" style="background:#e2f1e9">▣ Meeting</span><span class="pill" style="background:#eee7f7">◆ Personal</span></div><p style="margin-top:12px"><button class="btn small" onclick="exportCalendar()">Add to iPhone Calendar / Export (.ics)</button></p></section>`;
$('#prevMonth').onclick=()=>{calDate.setDate(calDate.getDate()+(calView==='week'?-7:0));if(calView==='month')calDate=new Date(calDate.getFullYear(),calDate.getMonth()-1,1);calendar()};
$('#nextMonth').onclick=()=>{calDate.setDate(calDate.getDate()+(calView==='week'?7:0));if(calView==='month')calDate=new Date(calDate.getFullYear(),calDate.getMonth()+1,1);calendar()};
$('#todayMonth').onclick=()=>{calDate=new Date();calendar()}
}
function download(data,name,type){let blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
async function exportCalendar(){let ev=[];db.meetings.forEach(m=>ev.push({title:m.title,date:m.date,kind:'Meeting'}));db.actions.filter(a=>!a.done&&a.due).forEach(a=>ev.push({title:a.title,date:a.due,kind:'Action'}));db.personal.filter(p=>p.date).forEach(p=>ev.push({title:p.title,date:p.date,kind:p.type}));let fmt=d=>d.replace(/-/g,'');let body=ev.map(e=>`BEGIN:VEVENT\nUID:${uid()}@meeting-manager\nDTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z/,'Z')}\nDTSTART;VALUE=DATE:${fmt(e.date)}\nSUMMARY:${e.kind}: ${e.title.replace(/[,;]/g,' ')}\nEND:VEVENT`).join('\n');let ics=`BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Meeting Manager//EN\n${body}\nEND:VCALENDAR`;let file=new File([ics],'meeting-manager-calendar.ics',{type:'text/calendar'});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Meeting Manager calendar',text:'Add these events to your iPhone Calendar'});return}catch(e){if(e.name==='AbortError')return}}download(ics,'meeting-manager-calendar.ics','text/calendar');toast('Calendar file exported. Open it on your iPhone and choose Add All.')}
$('#exportBackup').onclick=()=>download(JSON.stringify(db,null,2),'meeting-manager-backup.json','application/json');
$('#importBackup').onclick=()=>$('#backupFile').click();
$('#backupFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!data.projects||!data.meetings||!data.actions)throw Error();if(confirm('Restore this backup? This replaces the data currently stored in this browser.')){db={projects:data.projects,meetings:data.meetings,actions:data.actions,personal:data.personal||[],templates:data.templates||{},library:data.library||{categories:JSON.parse(JSON.stringify(categories)),prompts:JSON.parse(JSON.stringify(prompts))}};save();page('dashboard');toast('Backup restored')}}catch(err){alert('This does not appear to be a valid Meeting Manager backup.')}e.target.value=''};
try{page('dashboard')}catch(error){console.error('Meeting Manager startup error:',error);$('#content').innerHTML='<section class="panel"><h2>Meeting Manager could not load this page</h2><p>The saved data has been protected. Please use Backup data if available, then refresh the page. If the problem continues, send a screenshot of the browser console error.</p></section>'}
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
