<style>
:root{--navy:#17384a;--navy2:#214e62;--bg:#f3f6f8;--card:#fff;--ink:#172630;--muted:#687985;--line:#dce4e9;--teal:#19765f;--red:#b94343;--amber:#a66b17;--purple:#7654a5;--shadow:0 5px 20px #1938490b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.topbar{background:var(--navy);color:#fff;padding:15px max(18px,calc((100vw - 1200px)/2));display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-size:19px;font-weight:750;letter-spacing:.2px}.brand small{display:block;font-size:11px;font-weight:450;opacity:.75}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:9px 13px;font-weight:650}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.dark{background:#ffffff18;border-color:#ffffff40;color:#fff}.btn.danger{color:var(--red)}.btn.small{padding:6px 9px;font-size:13px}.layout{max-width:1200px;margin:auto;padding:20px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px}.sidebar{display:flex;flex-direction:column;gap:6px}.navbtn{border:0;background:transparent;text-align:left;padding:12px;border-radius:9px;color:#536571;font-weight:650}.navbtn.active{background:#e1ecef;color:var(--navy)}.navbtn span{display:inline-block;width:26px}.navlabel{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#92a0a8;margin:16px 10px 5px}.content{min-width:0}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:2px 0 18px}.pagehead h1{margin:0;font-size:25px;letter-spacing:-.5px}.sub{color:var(--muted);font-size:13px;margin-top:4px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.stat,.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.stat{padding:15px}.stat strong{font-size:27px;display:block}.stat span{font-size:12px;color:var(--muted)}.panel{padding:17px;margin-bottom:14px}.panel h2{font-size:16px;margin:0 0 13px}.split{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.list{display:flex;flex-direction:column;gap:8px}.item{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;gap:10px;align-items:flex-start;background:#fff}.itemmain{min-width:0;flex:1}.itemtitle{font-weight:700}.meta{font-size:12px;color:var(--muted);margin-top:3px}.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 7px;border-radius:20px;background:#eaf0f3;color:#52636d;margin:3px 3px 0 0}.tag.high{background:#fbe6e4;color:#a43131}.tag.medium{background:#fff1d9;color:#88550b}.tag.low{background:#e4f2ed;color:#24694f}.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#52636d}.field input,.field select,.field textarea,.search{width:100%;border:1px solid #cfd9df;border-radius:8px;padding:10px;background:#fff;color:var(--ink);min-width:0}.field textarea{min-height:84px;resize:vertical}.muted{color:var(--muted)}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.tab{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 11px;font-size:13px;font-weight:650}.tab.active{background:var(--navy);border-color:var(--navy);color:#fff}.categorygrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.catbtn{border:1px solid var(--line);background:#fff;border-radius:8px;text-align:left;padding:10px;font-size:13px;font-weight:650}.catbtn.active{border:2px solid var(--teal);background:#edf6f2;padding:9px}.quickprompts{display:flex;flex-wrap:wrap;gap:6px}.prompt{border:1px solid #cbd9df;background:#f8fbfc;border-radius:20px;padding:6px 10px;font-size:12px;color:#365260}.calendarhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.dayname{text-align:center;font-size:11px;color:var(--muted);font-weight:700;padding:5px}.day{min-height:105px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px;min-width:0}.daynum{font-size:11px;color:var(--muted);margin-bottom:5px}.event{font-size:10px;padding:4px 5px;border-radius:5px;margin:3px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#e1edf5;color:#28536d}.event.personal{background:#eee7f7;color:#65488c}.event.meeting{background:#e2f1e9;color:#28694e}.event.overdue{background:#fbe4e2;color:#9f3434}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filters select,.filters input{border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff}.check{width:18px;height:18px;accent-color:var(--teal);margin-top:2px}.modalback{position:fixed;inset:0;background:#10232f88;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.modalback.show{display:flex}.modal{width:min(680px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:15px;padding:20px;box-shadow:0 20px 70px #0004}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modalhead h2{margin:0;font-size:19px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#17384a;color:#fff;padding:10px 16px;border-radius:9px;display:none;z-index:8}.hide{display:none!important}.footer{font-size:11px;color:#8a989f;text-align:center;padding:16px}.pillrow{display:flex;gap:7px;flex-wrap:wrap}.pill{border-radius:20px;padding:5px 9px;background:#edf2f4;font-size:11px;font-weight:650}.actionsrow{display:flex;gap:6px;flex-wrap:wrap}
@media(max-width:760px){.layout{display:block;padding:13px}.sidebar{position:sticky;top:0;z-index:3;background:var(--bg);flex-direction:row;overflow:auto;padding:5px 0 10px}.navlabel{display:none}.navbtn{white-space:nowrap;padding:9px 11px;font-size:13px}.navbtn span{width:auto;margin-right:5px}.topbar{padding:12px 14px}.top-actions .btn{padding:7px 9px;font-size:12px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.stat{padding:10px}.stat strong{font-size:22px}.split{grid-template-columns:1fr}.pagehead h1{font-size:22px}.day{min-height:83px;padding:4px}.event{font-size:9px;padding:3px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.categorygrid{grid-template-columns:1fr 1fr}}
@media(max-width:420px){.day{min-height:70px}.dayname{font-size:9px}.event{font-size:8px}.stat span{font-size:10px}}
</style></head>
<body><div class="app">
<header class="topbar"><div class="brand">Meeting Manager<small>Project notes · Actions · Personal planning</small></div><div class="top-actions"><button class="btn dark" id="exportBackup">Backup data</button><button class="btn dark" id="importBackup">Restore</button><input id="backupFile" type="file" accept="application/json" hidden></div></header>
<div class="layout"><nav class="sidebar">
<div class="navlabel">Workspace</div>
<button class="navbtn active" data-page="dashboard"><span>▦</span>Dashboard</button>
<button class="navbtn" data-page="meetings"><span>▤</span>Meetings</button>
<button class="navbtn" data-page="actions"><span>☑</span>Actions</button>
<button class="navbtn" data-page="calendar"><span>▦</span>Calendar</button>
<div class="navlabel">Manage</div>
<button class="navbtn" data-page="projects"><span>▧</span>Projects</button>
<button class="navbtn" data-page="personal"><span>◷</span>Personal</button>
<button class="navbtn" data-page="templates"><span>✚</span>Quick templates</button>
</nav><main class="content" id="content"></main></div><div class="footer">Your information is stored in this browser on this device. Use Backup data regularly to keep a copy.</div></div>
<div class="modalback" id="modalback"><div class="modal"><div class="modalhead"><h2 id="modalTitle">Add item</h2><button class="btn small" id="closeModal">✕</button></div><div id="modalBody"></div></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,10);
const today=()=>new Date().toISOString().slice(0,10);
const plusDays=(d,n)=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const categories={
"Project Management and Programme":["Project objectives and scope","Project programme","Design deliverables and information release","Project roles and responsibilities","Client requirements and approvals","Project risks and dependencies","Change control and decisions","Meeting and communication arrangements"],
"Design Coordination":["Architectural coordination","Structural coordination","M&E spatial coordination","Plantroom coordination","Risers and service routes","Ceiling voids and builders work","BIM / Revit model coordination","Specialist subcontractor interfaces","Access and maintenance clearances"],
"Existing Building and Site Constraints":["Existing services surveys","Existing electrical infrastructure","Existing mechanical infrastructure","Existing capacity and spare capacity","Retained and redundant equipment","Phasing and decanting","Occupied building constraints","Heritage and fabric constraints","Site access and installation constraints"],
"M&E Design and Technical Proposals":["Incoming electrical supply and HV/LV distribution","Maximum demand and load assessment","Small power and containment","Lighting and emergency lighting","Fire alarm and life safety systems","Heating and cooling strategy","Ventilation and controls","Public health services","ICT and structured cabling","AV, security and access control","Standby generation and UPS","Testing and commissioning strategy"],
"Energy and Sustainability":["All-electric design strategy","Heat pumps and low-carbon heating","Photovoltaics and renewables","EV charging infrastructure","Energy demand and consumption","Metering and energy monitoring","BREEAM and sustainability targets","Operational performance and efficiency","Carbon reduction opportunities"],
"Compliance and Technical Assurance":["Building Regulations compliance","BS / EN / HTM / IS standards","Fire strategy and compartmentation","Electrical safety and earthing","Design calculations and technical assessments","Equipment specifications and selections","Technical submissions and approvals","Design risk assessments","Inspection, testing and certification"],
"Procurement, Cost and Value Engineering":["Cost plan and budget","Tender documentation","Procurement strategy and lead times","Contractor proposals and alternatives","Value engineering options","Cost savings and scope reductions","Variations and compensation events","Provisional sums and quotations"],
"Construction, Commissioning and Handover":["Construction progress","Contractor coordination","Requests for information (RFIs)","Site inspections and quality issues","Installation sequencing and access","Testing and commissioning","Witness testing and demonstrations","Training and O&M manuals","Defects and outstanding works","Practical completion and handover"]
};
const prompts={
"Project objectives and scope":["Are the project objectives and scope still aligned?","Has any additional or omitted scope been identified?","Are responsibilities and interfaces clearly defined?"],
"Project programme":["Is the design and construction programme on track?","What are the critical path activities or upcoming milestones?","Are there programme risks or dependencies requiring action?"],
"Design deliverables and information release":["What drawings, schedules or specifications are required?","Are information release dates agreed?","Is any information outstanding from the design team or client?"],
"Client requirements and approvals":["What client decisions or approvals are outstanding?","Have the Employer's Requirements changed?","Who is responsible for obtaining approval and by when?"],
"Project risks and dependencies":["What new project or technical risks have emerged?","Are existing risks being adequately mitigated?","Are there dependencies on third parties or statutory bodies?"],
"Architectural coordination":["Are plant, equipment and service routes coordinated with the architectural layout?","Are room layouts, ceiling zones and access panels agreed?","Are there any outstanding architectural details affecting M&E?"],
"Structural coordination":["Are structural openings, penetrations and supports agreed?","Are loads and plinth requirements confirmed?","Are there clashes with beams, slabs or structural elements?"],
"M&E spatial coordination":["Are the services coordinated within the available space?","Are ceiling voids and risers sufficient?","Are access and maintenance clearances maintained?"],
"Plantroom coordination":["Are plantroom layouts and equipment footprints agreed?","Are replacement routes, lifting provisions and access adequate?","Are electrical supplies, drainage, ventilation and controls coordinated?"],
"BIM / Revit model coordination":["Are the latest models being used by all disciplines?","Have clashes been reviewed and assigned?","Are levels, coordinates and model information aligned?"],
"Existing services surveys":["What surveys or investigations have been completed?","Are any further intrusive surveys required?","Have survey findings been incorporated into the design?"],
"Existing electrical infrastructure":["What existing supplies, switchgear and distribution are available?","Has capacity and condition been verified?","What is to be retained, upgraded or replaced?"],
"Existing mechanical infrastructure":["What existing plant and distribution can be retained?","Have condition, capacity and performance been established?","Are isolation and changeover arrangements understood?"],
"Existing capacity and spare capacity":["Has the existing maximum demand been established?","Is there sufficient capacity for the proposed loads and future provision?","Is a network or utility upgrade required?"],
"Incoming electrical supply and HV/LV distribution":["Has the maximum demand and supply capacity been agreed?","Are NIE / utility applications and connection requirements progressing?","Are substation location, transformer rating and intake arrangements confirmed?","Are harmonic studies, power quality or protection studies required?"],
"Maximum demand and load assessment":["Have connected loads and diversity assumptions been updated?","Are spare capacity and future loads included?","Are phase balancing and power factor considerations addressed?"],
"Lighting and emergency lighting":["Are lighting levels and luminaire selections appropriate?","Are lighting controls and interfaces agreed?","Is emergency lighting coverage, duration and testing strategy confirmed?"],
"Fire alarm and life safety systems":["Is the fire alarm category and extent agreed?","Are cause-and-effect and interfaces coordinated?","Are EVC, refuge and disabled toilet alarm requirements addressed?"],
"Heating and cooling strategy":["Is the heating and cooling strategy agreed?","Are plant capacities, zoning and controls coordinated?","Are electrical loads and plant locations confirmed?"],
"Ventilation and controls":["Are ventilation rates and plant duties confirmed?","Are duct routes, access and builders work coordinated?","Are BMS points, control interfaces and commissioning requirements agreed?"],
"All-electric design strategy":["Are all building loads accounted for in the electrical demand?","Are supply capacity and resilience adequate?","Are plant and operational strategies coordinated?"],
"Heat pumps and low-carbon heating":["Are heat pump duties, locations and performance confirmed?","Are electrical supplies and peak demand assessed?","Are acoustic, defrost and maintenance requirements addressed?"],
"Photovoltaics and renewables":["Is the proposed PV capacity and roof area confirmed?","Are inverter locations, cabling and grid connection requirements agreed?","Are export limitation and monitoring requirements understood?"],
"EV charging infrastructure":["What number and type of chargers are proposed?","Is spare electrical capacity available?","Are load management, metering and future expansion addressed?"],
"Building Regulations compliance":["Have applicable statutory requirements been identified?","Are any compliance gaps or departures outstanding?","Who is responsible for submissions and approvals?"],
"Fire strategy and compartmentation":["Are service penetrations and fire stopping coordinated?","Are fire-rated cable routes and compartment boundaries identified?","Are fire alarm and smoke control interfaces agreed?"],
"Design calculations and technical assessments":["Which calculations or studies are outstanding?","Are assumptions and input data agreed?","Who will review and approve the results?"],
"Cost plan and budget":["Are current proposals within the cost plan?","Have cost movements and risks been identified?","Are cost decisions required from the client?"],
"Value engineering options":["What alternative solutions have been considered?","What are the capital, programme and operational implications?","Has the impact on performance and compliance been assessed?"],
"Procurement strategy and lead times":["Are long-lead items identified and ordered in time?","Are technical submittals and approvals progressing?","Are procurement risks affecting the programme?"],
"Construction progress":["Is installation progressing in line with programme?","Are there constraints or outstanding information affecting progress?","What work is planned before the next meeting?"],
"Requests for information (RFIs)":["What technical clarification is required?","Who is responsible for responding?","Is the response affecting cost, programme or design?"],
"Testing and commissioning":["Is the commissioning programme agreed?","Are witnessing and integrated testing requirements defined?","Are access, power, water and controls available for testing?"],
"Training and O&M manuals":["Are O&M manuals and asset information being compiled?","What client training and demonstrations are required?","Are certificates, test results and record drawings complete?"]
};
let db=load();
if(!db.library)db.library={categories:{},prompts:{}};
if(!db.library.categories)db.library.categories={};
if(!db.library.prompts)db.library.prompts={};
// Add the expanded standard library without overwriting the user's existing edits.
Object.entries(categories).forEach(([aspect,items])=>{if(!db.library.categories[aspect])db.library.categories[aspect]=items.slice();});
Object.entries(prompts).forEach(([subject,items])=>{if(!db.library.prompts[subject])db.library.prompts[subject]=items.slice();});
function subjects(){return db.library.categories}
function promptLibrary(){return db.library.prompts}

function load(){try{return JSON.parse(localStorage.getItem('mm_db'))||{projects:[],meetings:[],actions:[],personal:[],templates:{}}}catch(e){return {projects:[],meetings:[],actions:[],personal:[],templates:{}}}}
function save(){localStorage.setItem('mm_db',JSON.stringify(db))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function projectName(id){return db.projects.find(p=>p.id===id)?.name||'Unassigned'}
function toast(s){let t=$('#toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}
function modal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modalback').classList.add('show')}
function closeModal(){$('#modalback').classList.remove('show')}
$('#closeModal').onclick=closeModal;$('#modalback').onclick=e=>{if(e.target.id==='modalback')closeModal()};
function page(p){$$('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===p));({dashboard,meetings,actions,calendar,projects,personal,templates}[p]||dashboard)()}
$$('.navbtn').forEach(b=>b.onclick=()=>page(b.dataset.page));
function head(title,sub,btn=''){return `<div class="pagehead"><div><h1>${title}</h1><div class="sub">${sub}</div></div>${btn}</div>`}
function dashboard(){
let open=db.actions.filter(a=>!a.done),over=open.filter(a=>a.due&&a.due<today()),high=open.filter(a=>a.priority==='High');
$('#content').innerHTML=head('Dashboard','Your current project commitments and personal workload.',`<button class="btn primary" onclick="newMeeting()">＋ New meeting</button>`)+
`<div class="grid"><div class="stat"><strong>${open.length}</strong><span>Open actions</span></div><div class="stat"><strong style="color:var(--red)">${over.length}</strong><span>Overdue</span></div><div class="stat"><strong>${high.length}</strong><span>High priority</span></div></div>
<div class="split" style="margin-top:14px"><section class="panel"><h2>Priority actions</h2>${actionList(open.filter(a=>a.priority==='High'||(a.due&&a.due<today())).slice(0,6))}<button class="btn small" onclick="page('actions')">View all actions</button></section><section class="panel"><h2>Upcoming meetings</h2>${meetingList(db.meetings.filter(m=>m.date>=today()).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5))}<button class="btn small" onclick="page('meetings')">All meetings</button></section></div>
<section class="panel"><h2>Projects</h2>${db.projects.length?`<div class="pillrow">${db.projects.map(p=>`<span class="pill">${esc(p.name)}</span>`).join('')}</div>`:'<div class="empty">Add your first project to get started.</div>'}</section>`;
}
function actionList(items){if(!items.length)return '<div class="empty">Nothing to show here.</div>';return `<div class="list">${items.map(a=>`<div class="item"><input class="check" type="checkbox" ${a.done?'checked':''} onchange="toggleAction('${a.id}',this.checked)"><div class="itemmain"><div class="itemtitle" style="${a.done?'text-decoration:line-through;color:#819099':''}">${esc(a.title)}</div><div class="meta">${esc(projectName(a.project))} · ${esc(a.category||'General')} · Due ${esc(a.due||'Not set')}</div><span class="tag ${a.priority.toLowerCase()}">${a.priority}</span>${a.owner?`<span class="tag">${esc(a.owner)}</span>`:''}</div><button class="btn small" onclick="editAction('${a.id}')">Edit</button></div>`).join('')}</div>`}
function meetingList(items){if(!items.length)return '<div class="empty">No meetings recorded yet.</div>';return `<div class="list">${items.map(m=>`<div class="item"><div class="itemmain"><div class="itemtitle">${esc(m.title)}</div><div class="meta">${esc(m.date)} · ${esc(projectName(m.project))} · ${esc(m.type)}</div></div><button class="btn small" onclick="openMeeting('${m.id}')">Open</button></div>`).join('')}</div>`}
function meetings(){let items=[...db.meetings].sort((a,b)=>b.date.localeCompare(a.date));$('#content').innerHTML=head('Meetings','Quickly capture the points that matter while you attend project meetings.',`<button class="btn primary" onclick="newMeeting()">＋ New meeting</button>`)+`<div class="panel"><input class="search" id="meetingSearch" placeholder="Search meetings or projects…"><div id="meetingResults" style="margin-top:12px">${meetingList(items)}</div></div>`;$('#meetingSearch').oninput=e=>$('#meetingResults').innerHTML=meetingList(items.filter(m=>(m.title+' '+projectName(m.project)+' '+m.type).toLowerCase().includes(e.target.value.toLowerCase())))}
function newMeeting(){if(!db.projects.length){addProject();toast('Add a project first, or create a project in the form.');return}modal('Start a meeting',`<form id="meetingForm"><div class="formgrid"><div class="field full"><label>Meeting title</label><input name="title" required placeholder="e.g. Electrical design team meeting"></div><div class="field"><label>Project</label><select name="project">${db.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Meeting type</label><select name="type">${['Design team meeting','Client progress meeting','Contractor progress meeting','Technical coordination','Site meeting','Internal project meeting','Electrical design review','Commissioning / handover','Other'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Date</label><input type="date" name="date" value="${today()}" required></div><div class="field"><label>Attendees (optional)</label><input name="attendees" placeholder="Names / organisations"></div><div class="field full"><label>Your role</label><select name="role"><option>Attendee</option><option>Electrical designer</option><option>Project manager</option><option>Client representative</option><option>Other</option></select></div></div><p style="text-align:right"><button class="btn primary">Start capturing</button></p></form>`);
$('#meetingForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let m={id:uid(),...f,notes:[],created:new Date().toISOString()};db.meetings.push(m);save();closeModal();openMeeting(m.id)}}
function openMeeting(id){let m=db.meetings.find(x=>x.id===id);if(!m)return;let selectedCat=Object.keys(db.library.categories)[0]||'',selectedSubject=(db.library.categories['Electrical design']||db.library.categories[selectedCat]||[])[0]||'',kind='Note';selectedCat=db.library.categories['Electrical design']?'Electrical design':selectedCat;
function render(){let subjects=db.library.categories[selectedCat]||[];let relevant=db.library.prompts[selectedSubject]||[];$('#content').innerHTML=head(esc(m.title),`${esc(projectName(m.project))} · ${esc(m.date)} · ${esc(m.type)}`,`<button class="btn" onclick="exportMeeting('${m.id}')">Export summary</button>`)+
`<div class="tabs"><button class="tab active">Capture notes</button><button class="tab" onclick="page('meetings')">Back to meetings</button></div>
<div class="split"><section class="panel"><h2>1. Select a subject</h2><div class="categorygrid">${Object.keys(db.library.categories).map(c=>`<button class="catbtn ${c===selectedCat?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div><div style="margin-top:14px"><label class="muted" style="font-size:12px;font-weight:700">SUBJECT</label><select id="subject" class="search" style="margin-top:5px">${subjects.map(s=>`<option ${s===selectedSubject?'selected':''}>${esc(s)}</option>`).join('')}</select></div>
<h2 style="margin-top:17px">2. Prefilled prompts</h2><div class="quickprompts">${relevant.map(p=>`<button class="prompt" data-prompt="${esc(p)}">＋ ${esc(p)}</button>`).join('')||'<span class="muted">Choose a subject to see suggested prompts.</span>'}</div></section>
<section class="panel"><h2>3. Capture point</h2><form id="noteForm"><div class="field"><label>Classification</label><div class="pillrow">${['Note','Action','Decision','Risk','Query','Change','Information'].map(k=>`<button type="button" class="tab ${kind===k?'active':''}" data-kind="${k}">${k}</button>`).join('')}</div></div><div class="field" style="margin-top:12px"><label>Note / description</label><textarea id="noteText" required placeholder="Type a short note or tap a suggested prompt…"></textarea></div><div id="actionFields" class="formgrid" style="margin-top:10px;${kind==='Action'?'':'display:none'}"><div class="field"><label>Responsible person</label><input name="owner" placeholder="Person / organisation"></div><div class="field"><label>Priority</label><select name="priority"><option>Medium</option><option>High</option><option>Low</option></select></div><div class="field"><label>Start date</label><input type="date" name="start" value="${m.date}"></div><div class="field"><label>Deadline</label><input type="date" name="due" value="${plusDays(m.date,7)}"></div><div class="field"><label>Duration (days)</label><input type="number" min="1" name="duration" value="1"></div></div><p style="margin:12px 0 0"><button class="btn primary" style="width:100%">＋ Add ${kind.toLowerCase()}</button></p></form></section></div>
<section class="panel"><h2>Captured in this meeting <span class="tag">${m.notes.length}</span></h2><div class="list">${m.notes.length?m.notes.map(n=>`<div class="item"><div class="itemmain"><span class="tag">${esc(n.kind)}</span><span class="tag">${esc(n.category)}</span><div style="margin-top:6px">${esc(n.text)}</div>${n.actionId?`<div class="meta">Action deadline: ${esc(db.actions.find(a=>a.id===n.actionId)?.due||'')}</div>`:''}</div><button class="btn small danger" onclick="deleteNote('${m.id}','${n.id}')">Remove</button></div>`).join(''):'<div class="empty">Your notes will appear here as you capture them.</div>'}</div></section>`;
$$('[data-cat]').forEach(b=>b.onclick=()=>{selectedCat=b.dataset.cat;selectedSubject=db.library.categories[selectedCat][0]||'';render()});
$('#subject').onchange=e=>{selectedSubject=e.target.value;render()};
$$('[data-prompt]').forEach(b=>b.onclick=()=>{let t=$('#noteText');t.value+=(t.value?' ':'')+b.dataset.prompt;t.focus()});
$$('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;render()});
$('#noteForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let note={id:uid(),kind,category:selectedCat,subject:selectedSubject,text:$('#noteText').value.trim()};if(kind==='Action'){let a={id:uid(),title:note.text,project:m.project,meeting:m.id,note:note.id,category:selectedCat,owner:f.owner,priority:f.priority||'Medium',start:f.start||m.date,due:f.due||'',duration:Number(f.duration)||1,done:false};db.actions.push(a);note.actionId=a.id}m.notes.push(note);save();render();toast(kind+' added')}}
render()}
function deleteNote(mid,nid){let m=db.meetings.find(x=>x.id===mid);let n=m.notes.find(x=>x.id===nid);if(n?.actionId)db.actions=db.actions.filter(a=>a.id!==n.actionId);m.notes=m.notes.filter(x=>x.id!==nid);save();openMeeting(mid)}
function toggleAction(id,v){let a=db.actions.find(x=>x.id===id);if(a){a.done=v;a.completed=v?today():'';save();page('actions')}}
function actions(){let items=[...db.actions].sort((a,b)=>(a.done-b.done)||((a.due||'9999').localeCompare(b.due||'9999')));$('#content').innerHTML=head('Actions','One consolidated list from project meetings and your own work.',`<button class="btn primary" onclick="newAction()">＋ Add action</button>`)+`<div class="filters"><input id="actionSearch" placeholder="Search actions…"><select id="projectFilter"><option value="">All projects</option>${db.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select><select id="statusFilter"><option value="open">Open actions</option><option value="all">All actions</option><option value="done">Completed</option></select><select id="priorityFilter"><option value="">All priorities</option><option>High</option><option>Medium</option><option>Low</option></select></div><section class="panel"><div id="actionResults"></div></section>`;function update(){let q=$('#actionSearch').value.toLowerCase(),p=$('#projectFilter').value,s=$('#statusFilter').value,pr=$('#priorityFilter').value;let filtered=items.filter(a=>(!q||(a.title+' '+a.category+' '+a.owner).toLowerCase().includes(q))&&(!p||a.project===p)&&(!pr||a.priority===pr)&&(s==='all'||(s==='done'?a.done:!a.done)));$('#actionResults').innerHTML=actionList(filtered)};['actionSearch','projectFilter','statusFilter','priorityFilter'].forEach(id=>$('#'+id).oninput=update);update()}
function newAction(){modal('Add action',`<form id="actionForm"><div class="formgrid"><div class="field full"><label>Action</label><input name="title" required></div><div class="field"><label>Project</label><select name="project"><option value="">Personal / unassigned</option>${db.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Category</label><select name="category">${Object.keys(db.library.categories).map(c=>`<option>${esc(c)}</option>`).join('')}<option>Personal</option></select></div><div class="field"><label>Priority</label><select name="priority"><option>Medium</option><option>High</option><option>Low</option></select></div><div class="field"><label>Responsible person</label><input name="owner"></div><div class="field"><label>Start date</label><input type="date" name="start" value="${today()}"></div><div class="field"><label>Deadline</label><input type="date" name="due"></div><div class="field"><label>Duration (days)</label><input type="number" name="duration" min="1" value="1"></div></div><p style="text-align:right"><button class="btn primary">Save action</button></p></form>`);$('#actionForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));db.actions.push({id:uid(),...f,duration:+f.duration||1,done:false});save();closeModal();actions()}}
function editAction(id){let a=db.actions.find(x=>x.id===id);if(!a)return;modal('Edit action',`<form id="editActionForm"><div class="formgrid"><div class="field full"><label>Action</label><input name="title" value="${esc(a.title)}" required></div><div class="field"><label>Project</label><select name="project"><option value="">Unassigned</option>${db.projects.map(p=>`<option value="${p.id}" ${a.project===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Category</label><input name="category" value="${esc(a.category||'')}"></div><div class="field"><label>Priority</label><select name="priority">${['High','Medium','Low'].map(x=>`<option ${a.priority===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Responsible person</label><input name="owner" value="${esc(a.owner||'')}"></div><div class="field"><label>Start date</label><input type="date" name="start" value="${a.start||''}"></div><div class="field"><label>Deadline</label><input type="date" name="due" value="${a.due||''}"></div><div class="field"><label>Duration (days)</label><input type="number" min="1" name="duration" value="${a.duration||1}"></div></div><p style="text-align:right"><button class="btn primary">Save changes</button></p></form>`);$('#editActionForm').onsubmit=e=>{e.preventDefault();Object.assign(a,Object.fromEntries(new FormData(e.target)));a.duration=+a.duration||1;save();closeModal();actions()}}
function projects(){$('#content').innerHTML=head('Projects','Project details and meeting records.',`<button class="btn primary" onclick="addProject()">＋ Add project</button>`)+`<section class="panel">${db.projects.length?`<div class="list">${db.projects.map(p=>`<div class="item"><div class="itemmain"><div class="itemtitle">${esc(p.name)}</div><div class="meta">Client: ${esc(p.client||'—')} · Reference: ${esc(p.reference||'—')}</div><div class="meta">${db.meetings.filter(m=>m.project===p.id).length} meetings · ${db.actions.filter(a=>a.project===p.id&&!a.done).length} open actions</div></div><button class="btn small" onclick="editProject('${p.id}')">Edit</button><button class="btn small danger" onclick="removeProject('${p.id}')">Delete</button></div>`).join('')}</div>`:'<div class="empty">No projects yet. Add your first project.</div>'}</section>`}
function addProject(id){let p=id?db.projects.find(x=>x.id===id):null;modal(p?'Edit project':'Add project',`<form id="projectForm"><div class="formgrid"><div class="field full"><label>Project name</label><input name="name" value="${esc(p?.name||'')}" required></div><div class="field full"><label>Client name</label><input name="client" value="${esc(p?.client||'')}" required></div><div class="field full"><label>Reference number</label><input name="reference" value="${esc(p?.reference||'')}" required></div></div><p style="text-align:right"><button class="btn primary">Save project</button></p></form>`);$('#projectForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(p)Object.assign(p,f);else db.projects.push({id:uid(),...f});save();closeModal();projects()}}
function editProject(id){addProject(id)}
function removeProject(id){if(!confirm('Delete this project? Existing meeting and action records will be retained as unassigned.'))return;db.projects=db.projects.filter(p=>p.id!==id);db.meetings.forEach(m=>{if(m.project===id)m.project=''});db.actions.forEach(a=>{if(a.project===id)a.project=''});save();projects()}
function personal(){$('#content').innerHTML=head('Personal','Private appointments and to-dos, kept separate from project meeting exports.',`<button class="btn primary" onclick="newPersonal()">＋ Add personal item</button>`)+`<div class="tabs"><button class="tab active">All personal items</button></div><section class="panel">${db.personal.length?`<div class="list">${db.personal.sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(p=>`<div class="item"><input class="check" type="checkbox" ${p.done?'checked':''} onchange="togglePersonal('${p.id}',this.checked)"><div class="itemmain"><div class="itemtitle">${esc(p.title)}</div><div class="meta">${esc(p.date||'No date')} ${p.time?'· '+esc(p.time):''} · ${esc(p.type)}</div>${p.private?'<span class="tag">Private</span>':''}</div><button class="btn small danger" onclick="deletePersonal('${p.id}')">Delete</button></div>`).join('')}</div>`:'<div class="empty">No personal appointments or tasks yet.</div>'}</section>`}
function newPersonal(){modal('Add personal item',`<form id="personalForm"><div class="formgrid"><div class="field full"><label>Description</label><input name="title" required></div><div class="field"><label>Type</label><select name="type"><option>To-do</option><option>Appointment</option><option>Reminder</option></select></div><div class="field"><label>Date</label><input type="date" name="date" value="${today()}"></div><div class="field"><label>Time (optional)</label><input type="time" name="time"></div><div class="field"><label>Duration (minutes)</label><input type="number" name="duration" value="30" min="1"></div><div class="field full"><label><input type="checkbox" name="private" checked> Keep private from project exports</label></div></div><p style="text-align:right"><button class="btn primary">Save item</button></p></form>`);$('#personalForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.private=e.target.private.checked;f.done=false;f.id=uid();db.personal.push(f);save();closeModal();personal()}}
function togglePersonal(id,v){let p=db.personal.find(x=>x.id===id);p.done=v;save();personal()}
function deletePersonal(id){db.personal=db.personal.filter(p=>p.id!==id);save();personal()}
let calDate=new Date(),calView='month';
const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function calEvents(key){let ev=[];db.actions.filter(a=>!a.done&&((a.start&&key>=a.start&&key<=plusDays(a.start,Math.max(1,Number(a.duration)||1)-1))||a.due===key)).forEach(a=>ev.push({id:a.id,type:'action',title:a.title,css:a.due===key&&a.due<today()?'overdue':'',prefix:a.due===key?'◆':'●'}));db.meetings.filter(m=>m.date===key).forEach(m=>ev.push({id:m.id,type:'meeting',title:m.title,css:'meeting',prefix:'▣'}));db.personal.filter(p=>p.date===key).forEach(p=>ev.push({id:p.id,type:'personal',title:p.title,css:'personal',prefix:'◆'}));return ev}
function previewCalendar(type,id){let item=(type==='action'?db.actions:type==='meeting'?db.meetings:db.personal).find(x=>x.id===id);if(!item)return;let details=type==='action'?`<p><strong>Project:</strong> ${esc(projectName(item.project))}</p><p><strong>Owner:</strong> ${esc(item.owner||'Unassigned')}</p><p><strong>Priority:</strong> ${esc(item.priority||'Medium')}</p><p><strong>Start:</strong> ${esc(item.start||'—')}</p><p><strong>Deadline:</strong> ${esc(item.due||'—')}</p><p><strong>Duration:</strong> ${esc(item.duration||1)} day(s)</p>`:type==='meeting'?`<p><strong>Project:</strong> ${esc(projectName(item.project))}</p><p><strong>Date:</strong> ${esc(item.date)}</p><p><strong>Type:</strong> ${esc(item.type||'Meeting')}</p><p><strong>Notes:</strong> ${(item.notes||[]).length}</p>`:`<p><strong>Type:</strong> ${esc(item.type||'Personal')}</p><p><strong>Date:</strong> ${esc(item.date||'—')}</p><p><strong>Time:</strong> ${esc(item.time||'—')}</p><p><strong>Duration:</strong> ${esc(item.duration||'—')} minutes</p>`;modal('Calendar item preview',`<h3>${esc(item.title)}</h3>${details}<div class="actionsrow"><button class="btn" onclick="closeModal()">Close</button>${type==='action'?`<button class="btn primary" onclick="closeModal();editAction('${id}')">Edit action</button>`:type==='meeting'?`<button class="btn primary" onclick="closeModal();openMeeting('${id}')">Open meeting</button>`:''}</div>`)}
function calendar(){let y=calDate.getFullYear(),mo=calDate.getMonth(),first=new Date(y,mo,1),offset=(first.getDay()+6)%7,start=calView==='month'?new Date(y,mo,1-offset):new Date(y,mo,calDate.getDate()-(calDate.getDay()+6)%7),count=calView==='month'?42:7,range=calView==='month'?calDate.toLocaleString('en-GB',{month:'long',year:'numeric'}):`${start.toLocaleDateString('en-GB',{day:'numeric',month:'short'})} – ${new Date(start.getFullYear(),start.getMonth(),start.getDate()+6).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}`;$('#content').innerHTML=head('Calendar','Select an item to preview its details.')+`<section class="panel"><div class="calendarhead"><div class="actionsrow"><button class="btn small" id="prevMonth">‹</button><button class="btn small" id="todayMonth">Today</button><button class="btn small" id="nextMonth">›</button></div><strong>${range}</strong><div class="actionsrow"><button class="btn small ${calView==='week'?'primary':''}" onclick="calView='week';calendar()">7 days</button><button class="btn small ${calView==='month'?'primary':''}" onclick="calView='month';calendar()">Month</button></div></div><div class="calendar">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div class="dayname">${d}</div>`).join('')}${Array.from({length:count},(_,i)=>{let d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),key=dateKey(d),ev=calEvents(key);return `<div class="day" style="${calView==='month'&&d.getMonth()!==mo?'opacity:.38':''}"><div class="daynum">${d.getDate()}</div>${ev.map(e=>`<button type="button" class="event ${e.css}" style="display:block;width:100%;border:0;text-align:left;cursor:pointer" onclick="previewCalendar('${e.type}','${e.id}')" title="Preview ${esc(e.title)}">${e.prefix} ${esc(e.title)}</button>`).join('')}</div>`}).join('')}</div><div class="pillrow" style="margin-top:12px"><span class="pill">● Project action</span><span class="pill" style="background:#e2f1e9">▣ Meeting</span><span class="pill" style="background:#eee7f7">◆ Personal</span></div><p style="margin-top:12px"><button class="btn small" onclick="exportCalendar()">Export calendar (.ics)</button></p></section>`;$('#prevMonth').onclick=()=>{if(calView==='week')calDate.setDate(calDate.getDate()-7);else calDate=new Date(calDate.getFullYear(),calDate.getMonth()-1,1);calendar()};$('#nextMonth').onclick=()=>{if(calView==='week')calDate.setDate(calDate.getDate()+7);else calDate=new Date(calDate.getFullYear(),calDate.getMonth()+1,1);calendar()};$('#todayMonth').onclick=()=>{calDate=new Date();calendar()}}
function templates(){$('#content').innerHTML=head('Subject & prompt library','Add, edit and remove categories, subjects and suggested notes.')+`<section class="panel"><h2>Subject categories <button class="btn small primary" onclick="editCategory()">＋ Category</button></h2>${Object.entries(db.library.categories).map(([c,ss])=>`<div style="margin:14px 0;border-bottom:1px solid #e1e8ec;padding-bottom:12px"><strong>${esc(c)}</strong> <button class="btn small" onclick="editCategory(decodeURIComponent('${encodeURIComponent(c)}'))">Rename</button> <button class="btn small danger" onclick="deleteCategory(decodeURIComponent('${encodeURIComponent(c)}'))">Delete</button><div style="margin:8px 0">${ss.map(x=>`<div class="item" style="padding:7px;margin:4px 0"><div class="itemmain">${esc(x)}</div><button class="btn small" onclick="editSubject(decodeURIComponent('${encodeURIComponent(c)}'),decodeURIComponent('${encodeURIComponent(x)}'))">Edit</button><button class="btn small danger" onclick="deleteSubject(decodeURIComponent('${encodeURIComponent(c)}'),decodeURIComponent('${encodeURIComponent(x)}'))">Delete</button></div>`).join('')}</div><button class="btn small" onclick="editSubject(decodeURIComponent('${encodeURIComponent(c)}'))">＋ Add subject</button></div>`).join('')}</section><section class="panel"><h2>Prompts <button class="btn small primary" onclick="editPrompt()">＋ Add prompt</button></h2>${Object.entries(db.library.prompts).map(([subject,ps])=>`<div style="margin:12px 0"><strong>${esc(subject)}</strong>${ps.map((x,i)=>`<div class="item" style="padding:7px;margin:5px 0"><div class="itemmain">${esc(x)}</div><button class="btn small" onclick="editPrompt(decodeURIComponent('${encodeURIComponent(subject)}'),${i})">Edit</button><button class="btn small danger" onclick="deletePrompt(decodeURIComponent('${encodeURIComponent(subject)}'),${i})">Delete</button></div>`).join('')}</div>`).join('')}</section>`}
function editCategory(old){modal(old?'Rename category':'Add category',`<form id="libForm"><div class="field"><label>Category name</label><input name="name" value="${esc(old||'')}" required></div><p><button class="btn primary">Save</button></p></form>`);$('#libForm').onsubmit=e=>{e.preventDefault();let name=e.target.elements.namedItem("name").value.trim();if(name!==old&&db.library.categories[name])return alert('Category already exists');if(old){let entries=Object.entries(db.library.categories).map(([k,v])=>[k===old?name:k,v]);db.library.categories=Object.fromEntries(entries)}else db.library.categories[name]=[];save();closeModal();templates()}}
function deleteCategory(c){if(!confirm('Delete this category and its subjects?'))return;delete db.library.categories[c];save();templates()}
function editSubject(c,old){modal(old?'Edit subject':'Add subject',`<form id="libForm"><div class="field"><label>Subject</label><input name="name" value="${esc(old||'')}" required></div><p><button class="btn primary">Save</button></p></form>`);$('#libForm').onsubmit=e=>{e.preventDefault();let name=e.target.elements.namedItem("name").value.trim(),list=db.library.categories[c];if(name!==old&&list.includes(name))return alert('Subject already exists');if(old){list[list.indexOf(old)]=name;if(db.library.prompts[old]){db.library.prompts[name]=db.library.prompts[old];delete db.library.prompts[old]}}else list.push(name);save();closeModal();templates()}}
function deleteSubject(c,x){if(!confirm('Delete this subject?'))return;db.library.categories[c]=db.library.categories[c].filter(v=>v!==x);delete db.library.prompts[x];save();templates()}
function editPrompt(subject,i){let all=[...new Set(Object.values(db.library.categories).flat())],old=subject!==undefined&&i!==undefined?db.library.prompts[subject]?.[i]:'';modal(old?'Edit prompt':'Add prompt',`<form id="libForm"><div class="field"><label>Subject</label><select name="subject">${all.map(x=>`<option value="${esc(x)}" ${x===subject?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field" style="margin-top:10px"><label>Prompt text</label><textarea name="text" required>${esc(old||'')}</textarea></div><p><button class="btn primary">Save prompt</button></p></form>`);$('#libForm').onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));if(old!==undefined&&subject!==undefined&&i!==undefined)db.library.prompts[subject].splice(i,1);(db.library.prompts[f.subject]??=[]).push(f.text.trim());save();closeModal();templates()}}
function deletePrompt(s,i){db.library.prompts[s].splice(i,1);if(!db.library.prompts[s].length)delete db.library.prompts[s];save();templates()}
function exportMeeting(id){let m=db.meetings.find(x=>x.id===id);let acts=db.actions.filter(a=>a.meeting===id);let lines=[m.title,m.date,projectName(m.project),m.type,'',...m.notes.map(n=>`${n.kind} | ${n.category} | ${n.subject}\n${n.text}`),'','ACTIONS',...acts.map(a=>`${a.title} | ${a.priority} | ${a.owner||'Unassigned'} | Due ${a.due||'TBC'}`)];download(lines.join('\n\n'),`${safe(m.title)}-notes.txt`,'text/plain')}
function safe(s){return (s||'export').replace(/[^a-z0-9-_]+/gi,'-').toLowerCase()}
function download(data,name,type){let blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
function exportCalendar(){let ev=[];db.meetings.forEach(m=>ev.push({title:m.title,date:m.date,kind:'Meeting'}));db.actions.filter(a=>!a.done&&a.due).forEach(a=>ev.push({title:a.title,date:a.due,kind:'Action'}));db.personal.filter(p=>p.date).forEach(p=>ev.push({title:p.title,date:p.date,kind:p.type}));let fmt=d=>d.replace(/-/g,'');let body=ev.map(e=>`BEGIN:VEVENT\nUID:${uid()}@meeting-manager\nDTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z/,'Z')}\nDTSTART;VALUE=DATE:${fmt(e.date)}\nSUMMARY:${e.kind}: ${e.title.replace(/[,;]/g,' ')}\nEND:VEVENT`).join('\n');download(`BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Meeting Manager//EN\n${body}\nEND:VCALENDAR`,'meeting-manager-calendar.ics','text/calendar')}
$('#exportBackup').onclick=()=>download(JSON.stringify(db,null,2),'meeting-manager-backup.json','application/json');
$('#importBackup').onclick=()=>$('#backupFile').click();
$('#backupFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!data.projects||!data.meetings||!data.actions)throw Error();if(confirm('Restore this backup? This replaces the data currently stored in this browser.')){db={projects:data.projects,meetings:data.meetings,actions:data.actions,personal:data.personal||[],templates:data.templates||{},library:data.library||{categories:JSON.parse(JSON.stringify(categories)),prompts:JSON.parse(JSON.stringify(prompts))}};save();page('dashboard');toast('Backup restored')}}catch(err){alert('This does not appear to be a valid Meeting Manager backup.')}e.target.value=''};
page('dashboard');
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
